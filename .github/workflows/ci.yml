name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Preparar diretórios
        run: make setup
      - name: Construir imagens
        run: make build
      - name: Lint e formatação
        run: make docker-lint
      - name: Testes e integração das bibliotecas
        run: make docker-test
      - name: Smoke do runtime
        run: docker run --rm monitoramento-risco-credito:runtime
