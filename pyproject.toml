[project]
name = "monitoramento-risco-credito"
version = "0.1.0"
description = "Confiabilidade e monitoramento de um classificador de crédito"
authors = []
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies"]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
scikit-learn = "1.9.1"
pandera = {version = "0.34.1", extras = ["pandas"]}
evidently = "0.7.23"
mlflow = "3.16.1"
pandas = "2.3.3"
numpy = "2.2.6"
scipy = "1.15.3"
pyarrow = "*"
xlrd = "*"
joblib = "*"
pydantic-settings = "*"
structlog = "*"
psutil = "*"
matplotlib = "*"
jinja2 = "*"
pyyaml = "*"

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-cov = "*"
ruff = "*"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["src"]
branch = true
