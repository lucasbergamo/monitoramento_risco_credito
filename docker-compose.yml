name: monitoramento-risco-credito

x-development: &development
  image: monitoramento-risco-credito:dev
  build:
    context: .
    target: dev
    args:
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  init: true
  environment:
    PROJECT_ROOT: /app
    SEED: ${SEED:-42}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    MLFLOW_TRACKING_URI: ${MLFLOW_RUNNER_TRACKING_URI:-http://mlflow:5000}
    MLFLOW_SUPPRESS_PRINTING_URL_TO_STDOUT: "true"
    MLFLOW_UI_URI: ${MLFLOW_UI_URI:-http://127.0.0.1:5000}
    MLFLOW_ENABLE_TELEMETRY: "false"
    DO_NOT_TRACK: "1"
    XDG_CACHE_HOME: /tmp/cache

services:
  mlflow:
    <<: *development
    command:
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:////mlflow/tracking.db
      - --serve-artifacts
      - --artifacts-destination
      - /mlartifacts
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --workers
      - "1"
      - --allowed-hosts
      - 127.0.0.1,127.0.0.1:5000,localhost,localhost:5000,mlflow,mlflow:5000,runner,runner:5000
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./state/mlflow:/mlflow
      - ./artifacts/runs:/mlartifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2); assert r.status == 200 and r.read() == b'OK'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 180s

  runner:
    <<: *development
    depends_on:
      mlflow:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./docs/evidencias:/app/docs/evidencias
      - ./models:/app/models
      - ./artifacts:/app/artifacts
      - ./state:/app/state

  ci:
    <<: *development
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      PROJECT_ROOT: /app
      MLFLOW_TRACKING_URI: ${MLFLOW_RUNNER_TRACKING_URI:-http://mlflow:5000}
      TC4_TRACKING_INTEGRATION_URI: ${MLFLOW_RUNNER_TRACKING_URI:-http://mlflow:5000}
      MLFLOW_SUPPRESS_PRINTING_URL_TO_STDOUT: "true"
      MLFLOW_ENABLE_TELEMETRY: "false"
      DO_NOT_TRACK: "1"
    # Sem bind mounts: testes usam fixtures e estado temporário dentro da imagem.
    command: ["python", "-m", "pytest", "-q", "-p", "no:cacheprovider"]
